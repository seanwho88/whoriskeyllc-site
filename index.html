<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoriskey LLC</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff9f2;
    --glow: #ffd9a0aa;
    --fg: #4e2a04;
    --muted: #8a6a4a;
    --s2: #c62828;
    --s3: #e64a19;
    --s4: #ff8f00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171210;
      --glow: #7a3d1eaa;
      --fg: #f3ddc0;
      --muted: #c9a487;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(circle at 50% -10%, var(--glow), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--s3);
    background: color-mix(in srgb, var(--s4) 15%, transparent);
    border-radius: 999px;
    padding: 0.3rem 0.8rem;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 0.75rem;
    background: linear-gradient(135deg, var(--s2), var(--s3), var(--s4));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .divider {
    width: 4rem;
    height: 3px;
    border-radius: 999px;
    margin: 0 auto 1.25rem;
    background: linear-gradient(90deg, var(--s2), var(--s3), var(--s4));
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 0.5rem;
    font-size: 1.05rem;
  }
  a {
    color: var(--s3);
    text-decoration: none;
    font-weight: 500;
  }
  a:hover {
    text-decoration: underline;
  }
  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.8;
  }
</style>
</head>
<body>
<main>
  <span class="badge">Newly formed &middot; 2026</span>
  <h1>Whoriskey LLC</h1>
  <div class="divider"></div>
  <p>A software development company. Current work includes voxtown, a social music app.</p>
  <p><a href="mailto:admin@whoriskeyllc.com">admin@whoriskeyllc.com</a></p>
  <footer>&copy; 2026 Whoriskey LLC</footer>
</main>
</body>
</html>
